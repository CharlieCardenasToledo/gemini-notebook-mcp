name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:live:preflight

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: mkdir -p /tmp/notebooklm-package-smoke
      - run: npm pack --pack-destination /tmp/notebooklm-package-smoke
      - run: npm install --prefix /tmp/notebooklm-package-smoke /tmp/notebooklm-package-smoke/*.tgz --ignore-scripts --no-audit --no-fund
      - run: npm run package:smoke -- /tmp/notebooklm-package-smoke/node_modules/@charlie.act7/gemini-notebook-mcp/dist/cli.js
