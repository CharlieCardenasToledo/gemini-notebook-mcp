name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:live:preflight

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: mkdir -p /tmp/notebooklm-package-smoke
      - run: npm pack --pack-destination /tmp/notebooklm-package-smoke
      - name: Verify published files in local tarball
        shell: bash
        run: |
          npm pack --dry-run --json > /tmp/notebooklm-package-files.json
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/notebooklm-package-files.json", "utf8")); const files=data[0]?.files?.map(x=>x.path) ?? []; if (!files.includes("npm-shrinkwrap.json") || files.includes("package-lock.json")) process.exit(1)'
      - run: npm install --prefix /tmp/notebooklm-package-smoke /tmp/notebooklm-package-smoke/*.tgz --ignore-scripts --no-audit --no-fund
      - run: npm run package:smoke -- /tmp/notebooklm-package-smoke/node_modules/@charlie.act7/gemini-notebook-mcp/dist/cli.js
      - name: Patchright Chromium provisioning smoke
        shell: bash
        run: |
          INSTALL_ROOT=/tmp/notebooklm-package-smoke
          NODE_MODULES_ROOT="$INSTALL_ROOT/node_modules"
          PACKAGE_DIR="$NODE_MODULES_ROOT/@charlie.act7/gemini-notebook-mcp"
          BIN=$(node -e 'const p=require(process.argv[1]); const b=typeof p.bin === "string" ? p.bin : p.bin["gemini-notebook-mcp"]; process.stdout.write(b)' "$PACKAGE_DIR/package.json")
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/external-browser-cache"
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          node "$PACKAGE_DIR/$BIN" browser install --json > "$RUNNER_TEMP/browser-install.json"
          node -e 'const fs=require("fs"), path=require("path"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (p.browser !== "chromium" || p.installed !== true || p.hermetic !== true || !p.executablePath || !fs.statSync(p.executablePath).isFile()) process.exit(1); const root=fs.realpathSync(process.argv[2]); const exe=fs.realpathSync(p.executablePath); const rel=path.relative(root, exe); if (!rel || path.isAbsolute(rel) || rel.startsWith("..")) process.exit(1)' "$RUNNER_TEMP/browser-install.json" "$NODE_MODULES_ROOT"
          node "$PACKAGE_DIR/$BIN" browser status --json > "$RUNNER_TEMP/browser-status.json"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (p.browser !== "chromium" || p.installed !== true || p.hermetic !== true || !p.executablePath) process.exit(1)' "$RUNNER_TEMP/browser-status.json"
          test -z "$(find "$PLAYWRIGHT_BROWSERS_PATH" -mindepth 1 -print -quit)"

  package-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Provision Chromium from publishable tarball
        run: node scripts/package-browser-smoke.mjs
